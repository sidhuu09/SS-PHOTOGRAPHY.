
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SS PHOTOGRAPHY | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:420px;background:#151515;border:1px solid #c9a227;border-radius:16px;padding:28px;box-shadow:0 0 25px #c9a22722}
h1{text-align:center;color:#d4af37;margin-top:0}
p{text-align:center;color:#bbb}
.tabs{display:flex;gap:8px;margin:22px 0}
button{cursor:pointer;border:0;border-radius:8px;padding:12px;font-weight:bold}
.tabs button{flex:1;background:#292929;color:#fff}
.tabs button.active,.main{background:#d4af37;color:#111}
input{width:100%;padding:13px;margin:8px 0;background:#222;color:#fff;border:1px solid #555;border-radius:8px}
.main{width:100%;margin-top:12px}
.link{display:block;text-align:center;color:#d4af37;margin-top:16px;cursor:pointer}
#status{text-align:center;overflow-wrap:anywhere;font-size:14px;margin-top:16px}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
<h1>📸 SS PHOTOGRAPHY</h1>
<p>Welcome! Login or create your account.</p>

<div id="authBox">
<div class="tabs">
<button id="loginTab" class="active" type="button">Login</button>
<button id="registerTab" type="button">Create Account</button>
</div>

<form id="authForm">
<input id="name" class="hidden" type="text" placeholder="Your Name" autocomplete="name">
<input id="email" type="email" placeholder="Email Address" autocomplete="email" required>
<input id="password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" autocomplete="current-password" required>
<button class="main" id="submitBtn" type="submit">Login</button>
</form>

<span class="link" id="forgotBtn">Forgot Password?</span>
</div>

<div id="loggedBox" class="hidden">
<p id="userInfo"></p>
<button class="main" id="nextBtn" type="button">Continue to Next Page</button>
<button id="logoutBtn" type="button" style="width:100%;margin-top:10px;background:#333;color:white">Logout</button>
</div>
<div id="status" role="status"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import {
 getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
 sendPasswordResetEmail, signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyAqv-Xg_98S-ebQVLA2OaugVX0NA16rZ4c",
 authDomain: "ss-photography-new.firebaseapp.com",
 projectId: "ss-photography-new",
 storageBucket: "ss-photography-new.firebasestorage.app",
 messagingSenderId: "764601358812",
 appId: "1:764601358812:web:1a76b0c2b6b0df3eb6d719"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);
let mode = "login";
const status = message => $("status").textContent = message;

$("loginTab").onclick = () => setMode("login");
$("registerTab").onclick = () => setMode("register");

function setMode(newMode) {
 mode = newMode;
 $("loginTab").classList.toggle("active", mode === "login");
 $("registerTab").classList.toggle("active", mode === "register");
 $("name").classList.toggle("hidden", mode !== "register");
 $("name").required = mode === "register";
 $("password").autocomplete = mode === "register" ? "new-password" : "current-password";
 $("submitBtn").textContent = mode === "register" ? "Create Account" : "Login";
 $("forgotBtn").classList.toggle("hidden", mode !== "login");
 status("");
}

$("authForm").addEventListener("submit", async event => {
 event.preventDefault();
 const email = $("email").value.trim();
 const password = $("password").value;
 $("submitBtn").disabled = true;
 try {
  if (mode === "register") {
   const name = $("name").value.trim();
   const result = await createUserWithEmailAndPassword(auth, email, password);
   if (name) await updateProfile(result.user, { displayName: name });
   status("Account created successfully!");

} else {
   const result = await signInWithEmailAndPassword(auth, email, password);
   status("Login successful!");

   if (result.user.uid === "3nv22eD6StTIMnRtIcz3Wu5zkHw2") {
     window.location.href = "./admin.html";
   } else {
     window.location.href = "./booking.html";
   }
  }
  
 } catch (error) {
  const messages = {
   "auth/email-already-in-use": "This email is already registered. Please login.",
   "auth/invalid-email": "Please enter a valid email address.",
   "auth/weak-password": "Password must contain at least 6 characters.",
   "auth/invalid-credential": "Incorrect email or password.",
   "auth/network-request-failed": "Network error. Check your internet and try again.",
   "auth/too-many-requests": "Too many attempts. Please try again later."
  };
  status(messages[error.code] || error.message);
 } finally {
  $("submitBtn").disabled = false;
 }
});

$("forgotBtn").onclick = async () => {
 const email = $("email").value.trim();
 if (!email) return status("Enter your email address first.");
 try {
  await sendPasswordResetEmail(auth, email);
  status("Password reset email sent. Check your inbox.");
 } catch (error) {
  status(error.message);
 }
};

onAuthStateChanged(auth, user => {
 $("authBox").classList.toggle("hidden", !!user);
 $("loggedBox").classList.toggle("hidden", !user);
 if (user) {
  $("userInfo").textContent = "Logged in as " + user.email;
  status("You are logged in.");
 } else {
  status("");
 }
});


$("nextBtn").onclick = () => {
  const user = auth.currentUser;

  if (!user) {
    status("Please login first.");
    return;
  }

  if (user.uid === "3nv22eD6StTIMnRtIcz3Wu5zkHw2") {
    window.location.href = "./admin.html";
  } else {
    window.location.href = "./booking.html";
  }
};

$("logoutBtn").onclick = async () => {
 try {
  await signOut(auth);
  status("Logged out successfully.");
 } catch (error) {
  status(error.message);
 }
};
</script>
</body>
</html>
